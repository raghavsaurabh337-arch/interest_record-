<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
    body {
    margin: 0;
    padding: 0;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

.calculator {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
}

#display {
    width: 100%;
    height: 60px;
    font-size: 24px;
    text-align: right;
    margin-bottom: 15px;
    border: none;
    outline: none;
    padding-right: 10px;
    box-sizing: border-box;
    color: antiquewhite;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    
}

button {
    height: 60px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #8b7575;
    color: white;
}

button:hover {
    background: #4b4646;
}

.zero {
    grid-column: span 4;
}
    </style>
</head>
<body>

{% include 'navbar.html' %}
<div class="calculator">
    <input type="text" id="display" disabled>

    <div class="buttons">
        <button>C</button>
        <button>/</button>
        <button>*</button>
        <button>-</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>+</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>=</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>.</button>

        <button class="zero">0</button>
    </div>
</div>

<script>
const display = document.getElementById("display");
const buttons = document.querySelectorAll("button");

let expression = "";

buttons.forEach(button => {

   
    button.addEventListener("click", function () {

        let value = this.innerText;

        
        if (value === "C") {
            expression = "";
            display.value = "";

        } else if (value === "=") {

            try {
                expression = eval(expression).toString();
                display.value = expression;
            } catch {
                display.value = "Error";
                expression = "";
            }

        } else {
            expression += value;
            display.value = expression;
        }

    });

});
</script>
</body>
{% include 'navbar.html' %}
</html>
