<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

{% include 'navbar.html' %}

<div class="container mt-4">
    <h2>Edit Record</h2>
    <form method="POST" action="{% url 'edit' record.id %}">
        {% csrf_token %}
        <div class="mb-2">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ record.name }}" required>
        </div>
        <div class="mb-2">
            <label>Amount</label>
            <input type="number" name="amount" class="form-control" value="{{ record.amount }}" required>
        </div>
        <div class="mb-2">
            <label>Interest Rate</label>
            <input type="number" step="0.01" name="interest_rate" class="form-control" value="{{ record.interest_rate }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'recode' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
